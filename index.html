<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHITSIMIKIZO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="hero glass">
      <h1>JUST FOR YOU HNY!</h1>
      <h3>TIYAMIKE</h3>
      <p>MAWA UBWERA KAPENA SUBWERA?</p>

      <div class="button-row">
        <button type="button" id="openTimeBtn">NDIBWERA</button>
        <button type="button" id="openFormBtn">SINDIBWERA</button>
        
      </div>
    </section>

    <section id="formSection" class="glass form-card hidden">
      <button type="button" class="close-btn" data-close="formSection">&times;</button>
      <h2>ZIFUKWA ZOLEPHELETSA KUBWERA</h2>

      <form action="https://formspree.io/f/mbglazyq" method="POST">
        <input type="hidden" name="form_type" value="Visitor Information">

        <label for="name">chifukwa choyamba</label>
        <input id="name" name="Full Name" type="text" required>

        <label for="name">chifukwa chachiwiri</label>
        <input id="name" name="Full Name" type="text" required>

        <label for="name">chifukwa chachitatu</label>
        <input id="name" name="Full Name" type="text" required>

        <h4>Ngati zifukwazi zili zosagwira mtima undilipira</h4>

        <button class="submit-btn" type="submit">SEND</button>
      </form>
    </section>

    <section id="timeSection" class="glass form-card hidden">
      <button type="button" class="close-btn" data-close="timeSection">&times;</button>
      <h2>YIKA MMENE MAYENDEDWE AKHALIRE</h2>

      <form action="https://formspree.io/f/mbglazyq" method="POST">
        <input type="hidden" name="form_type" value="Coming and Going Time">

        <label for="timeComments">Undipangira chani ukabwera</label>
        <textarea id="timeComments" name="Comments" rows="3"></textarea>


        <label for="comingTime">Nthawi yobwera</label>
        <input id="comingTime" name="Coming Time" type="time" required>

        <label for="goingTime">Nthawi yobwelelera</label>
        <input id="goingTime" name="Going Time" type="time" required>

        <button class="submit-btn" type="submit">SEND</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
